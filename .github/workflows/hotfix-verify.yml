name: Privacy Hotfix Verify

# origin/main has no CI workflow at all yet (the broader stabilization
# work in PR #2 adds one, separately). This narrow workflow exists only
# to obtain a real GitHub Actions run proving this specific hotfix -
# it deliberately does NOT run tsc/eslint as hard gates, because both
# currently fail on pre-existing, unrelated baseline bugs (skills.tsx's
# TypeScript error, ProjectImageGallery.tsx's hook-order lint error)
# that predate this hotfix and are already fixed in PR #2 - fixing them
# here would mean importing that broader work into what is meant to be
# the smallest possible emergency fix. Confirmed identical on
# unmodified origin/main via `git stash` before this hotfix's own
# changes were added - see docs/rebuild/P01A5H_PRIVACY_HOTFIX_REPORT.md.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      # Temporary bootstrap trigger, same reasoning as PR #2's
      # equivalent: a workflow that doesn't exist on the default branch
      # yet won't run for workflow_dispatch, and a plain push here
      # proves the workflow executes before any merge.
      - fix/p01a-live-yango-image-privacy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotfix-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and privacy-regression check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (reproducible)
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Privacy regression check
        working-directory: frontend
        run: node scripts/verify-privacy-hotfix.mjs
