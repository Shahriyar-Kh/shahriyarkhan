name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      # Temporary bootstrap trigger (P01A.3, carried forward in P01A.4):
      # this workflow has never existed on `main`, and GitHub will not
      # run `workflow_dispatch` for a workflow that isn't yet on the
      # default branch. Listing the current integration branch here lets
      # a plain `push` prove the workflow actually runs against this
      # exact branch commit before merge. Remove this branch name once
      # the workflow lands on `main` and a normal PR/dispatch run has
      # been observed there.
      - fix/p01a-stabilization-integrated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    env:
      # Isolated, test-only SQLite database - never the live Render/Postgres
      # database. DJANGO_SECRET_KEY is a non-secret placeholder used only
      # for `manage.py check`/`test` under config.settings.development; it
      # is never used against config.settings.production, which has its
      # own fail-fast check (see apps/core/tests.py) and is not exercised
      # against real infrastructure by this workflow.
      USE_SQLITE: "1"
      DJANGO_SECRET_KEY: ci-placeholder-secret-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches render.yaml's pinned production runtime (pythonVersion: 3.11).
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/prod.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements/prod.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migration consistency check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Backend test suite
        working-directory: backend
        # apps.inquiries added (CF-H1): its own contact/service-request
        # intake-resilience tests were previously never exercised by CI at
        # all, since this list predates that app having any tests.
        run: python manage.py test apps.portfolio apps.site_config apps.resume_builder apps.core apps.inquiries -v 2

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches frontend/package.json's "engines.node": ">=22.12.0".
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (reproducible)
        working-directory: frontend
        run: npm ci

      - name: Frontend test suite
        working-directory: frontend
        run: npx vitest run

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        # No VITE_API_BASE_URL is set: frontend/src/lib/api.ts already
        # falls back to a same-origin-relative "" base when it is unset,
        # which is this project's established safe build fallback - no
        # invented or committed value is needed for the build to succeed.
        run: npm run build

      - name: Privacy regression check
        working-directory: frontend
        # Absorbed from the P01A5H emergency hotfix's standalone
        # hotfix-verify.yml (superseded by this workflow once
        # reconciled, P01A5R.1) - proves the removed Yango screenshot
        # stays out of source and the build output.
        run: node scripts/verify-privacy-hotfix.mjs

  web:
    name: Web (Next.js portfolio - P01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches web/package.json's "engines.node" and web/.nvmrc exactly.
          # Node 20 previously here was too old for this dependency tree:
          # jsdom@30 requires ^22.22.2 || ^24.15.0 || >=26.0.0, undici@8.10
          # requires >=22.19.0, and @testing-library/jest-dom@7 requires
          # >=22 - under Node 20 every Vitest worker failed before running
          # a single test ("webidl.util.markAsUncloneable is not a
          # function", from undici's CacheStorage). 22.22.2 is the oldest
          # version in the Node 22 LTS line that satisfies jsdom's range,
          # and matches ../frontend/package.json's own existing "engines.
          # node": ">=22.12.0" convention (the 22.x line, not 24.x).
          node-version-file: "web/.nvmrc"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (reproducible)
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test suite
        working-directory: web
        run: npm run test

      - name: Production build
        working-directory: web
        # No NEXT_PUBLIC_API_BASE_URL is set: IS_API_CONFIGURED (lib/api/
        # config.ts) is false, so every API call short-circuits to
        # {ok:false, error:{kind:"not_configured"}} with zero fetch calls
        # - the build is fully offline-deterministic and every page
        # renders its honest EmptyState/unavailable path instead of
        # failing. This is this app's established safe build fallback,
        # matching the frontend job's own VITE_API_BASE_URL-less build.
        run: npm run build

      - name: Dependency audit (visible, non-blocking)
        working-directory: web
        # A phase that ships nothing to production shouldn't fail its
        # build on an unrelated upstream advisory - see
        # docs/rebuild/P01_ARCHITECTURE.md's security section.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
